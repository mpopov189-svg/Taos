# Approval required: paid, always-on paper bot plus 1 GB persistent disk.
# Applies to the existing service; this file is not applied automatically.
services:
  - type: web
    name: misho-autobot-demo
    runtime: docker
    repo: https://github.com/mpopov189-svg/Taos
    branch: main
    plan: 0.5c-512mb
    region: frankfurt
    numInstances: 1
    autoDeployTrigger: 'off'
    healthCheckPath: /health
    maxShutdownDelaySeconds: 60
    disk:
      name: misho-autobot-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: MODE
        value: paper
      - key: ENABLE_LIVE
        value: '0'
      - key: PUBLIC_DEPLOYMENT
        value: '1'
      - key: DATA_DIR
        value: /var/data
      - key: REQUIRE_PERSISTENT_DATA
        value: '1'
      - key: BOT_PASSWORD
        sync: false
